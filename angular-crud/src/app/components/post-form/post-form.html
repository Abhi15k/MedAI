<div class="container">
  <div class="header">
    <h1>✏️ {{ isEditMode ? 'Edit Post' : 'Add New Post' }}</h1>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>
  
  <div *ngIf="error" class="error">{{ error }}</div>

  <form [formGroup]="postForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="form-group">
      <label for="title">Title <span class="required">*</span></label>
      <input 
        type="text" 
        id="title" 
        formControlName="title"
        class="form-control"
        [class.invalid]="title?.invalid && title?.touched"
        placeholder="Enter post title"
      />
      <div class="error-message" *ngIf="title?.invalid && title?.touched">
        <span *ngIf="title?.errors?.['required']">Title is required</span>
        <span *ngIf="title?.errors?.['minlength']">Title must be at least 3 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="body">Body <span class="required">*</span></label>
      <textarea 
        id="body" 
        formControlName="body"
        class="form-control"
        [class.invalid]="body?.invalid && body?.touched"
        rows="6"
        placeholder="Enter post content"
      ></textarea>
      <div class="error-message" *ngIf="body?.invalid && body?.touched">
        <span *ngIf="body?.errors?.['required']">Body is required</span>
        <span *ngIf="body?.errors?.['minlength']">Body must be at least 10 characters</span>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Saving...' : 'Save' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="loading">
        Cancel
      </button>
    </div>
  </form>
</div>
